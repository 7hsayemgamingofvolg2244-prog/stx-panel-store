<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout | STX STORE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="stx-body">

  <nav class="navbar">
    <div class="nav-brand">STX STORE</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Panels</a>
      <a href="my-orders.html">My Orders</a>
      <a href="my-key.html">My Key</a>
    </div>
  </nav>

  <main class="container">
    <div class="checkout-grid">
      <!-- Product & Duration Box -->
      <div class="checkout-card">
        <h3>1. Select Duration</h3>
        <div class="form-group">
          <label>Product</label>
          <input type="text" id="productName" value="Drip Client Non-Root Panel" readonly class="input-readonly">
          <input type="hidden" id="productId" value="drip-client-non-root">
        </div>

        <div class="form-group">
          <label>Choose Duration</label>
          <select id="packageSelect" class="stx-input">
            <option value="pkg_1d" data-days="1" data-price="150">1 Day - ৳150</option>
            <option value="pkg_7d" data-days="7" data-price="600" selected>7 Days - ৳600</option>
            <option value="pkg_30d" data-days="30" data-price="1800">30 Days - ৳1800</option>
          </select>
        </div>

        <div class="form-group">
          <label>Coupon Code</label>
          <div class="coupon-row">
            <input type="text" id="couponCode" placeholder="Enter coupon" class="stx-input">
            <button type="button" id="btnCoupon" class="btn-secondary">Apply</button>
          </div>
        </div>

        <div class="total-box">
          <span>Payable Total:</span>
          <span id="totalDisplay" class="highlight-price">৳600</span>
        </div>
      </div>

      <!-- bKash Send Money Box -->
      <div class="checkout-card bkash-theme">
        <h3>2. bKash Send Money</h3>
        <p>Send Money to the following official bKash personal number:</p>
        
        <div class="bkash-badge">
          <span>bKash Number:</span>
          <strong id="bkashNum">01860909272</strong>
          <button type="button" class="btn-sm" onclick="navigator.clipboard.writeText('01860909272'); alert('Copied 01860909272');">COPY</button>
        </div>

        <form id="orderForm">
          <div class="form-group">
            <label>Sender bKash Number</label>
            <input type="tel" id="senderNumber" placeholder="01XXXXXXXXX" required class="stx-input">
          </div>

          <div class="form-group">
            <label>bKash Transaction ID (TrxID)</label>
            <input type="text" id="trxId" placeholder="e.g. CB58AK91" required class="stx-input uppercase">
          </div>

          <button type="submit" id="btnPlaceOrder" class="btn-bkash">Submit & Get Key Automatically</button>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="js/checkout.js"></script>
</body>
</html>
